{% if page.paginator.num_pages > 1 %}
<div class="flex items-center justify-between mt-4 text-xs text-slate-600">
  <div>第 {{ page.number }} / {{ page.paginator.num_pages }} 页</div>
  <div class="flex gap-2">
    {% if page.has_previous %}<a class="border rounded px-3 py-1 bg-white" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.previous_page_number }}">上一页</a>{% endif %}
    {% if page.has_next %}<a class="border rounded px-3 py-1 bg-white" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&{% endif %}{% endfor %}page={{ page.next_page_number }}">下一页</a>{% endif %}
  </div>
</div>
{% endif %}
