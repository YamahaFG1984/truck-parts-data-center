<div class="bg-white rounded-lg border border-slate-200 p-10 text-center">
  <div class="text-3xl mb-3">⏳</div>
  <div class="font-semibold">{{ batch.get_status_display }}… 已处理 {{ batch.stats.processed|default:0 }} / {{ batch.stats.total|default:"?" }} 行</div>
  <pre class="mt-4 text-xs text-slate-500 whitespace-pre-wrap">{{ batch.log }}</pre>
  <p class="text-xs text-slate-400 mt-3">后台任务处理中（需要运行 <code>python manage.py qcluster</code> 或 docker compose 中的 worker）</p>
</div>
